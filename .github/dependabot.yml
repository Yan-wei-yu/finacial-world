version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot keeps the SHAs and version comments current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
# Python packages are hash-locked in requirements.lock; see README「更新相依套件」to regenerate it.
